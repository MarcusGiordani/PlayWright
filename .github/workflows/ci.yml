name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Pa157984152ria!
          MYSQL_DATABASE: socialmedia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Make mvnw executable
        run: chmod +x api/mvnw

      # ── JUnit ────────────────────────────────────────────────────────────
      - name: Run JUnit tests
        working-directory: api
        run: ./mvnw test

      # ── Jest ─────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run Jest tests
        working-directory: client
        run: npm test -- --watchAll=false

      # ── Start services for Playwright ────────────────────────────────────
      - name: Start backend
        working-directory: api
        run: nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: client
        run: nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for backend (port 8080)
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8080/auth/signin \
              -H "Content-Type: application/json" \
              -d '{"email":"ci@test.com","password":"Ci@12345"}' \
              --connect-timeout 3 --max-time 5 2>/dev/null)
            if [ -n "$STATUS" ] && [ "$STATUS" != "000" ]; then
              echo "Backend ready (HTTP $STATUS)"
              exit 0
            fi
            echo "  attempt $i/36 — not ready, retrying in 5s..."
            sleep 5
          done
          echo "Backend did not respond after 3 minutes."
          tail -60 /tmp/backend.log
          exit 1

      - name: Wait for frontend (port 3000)
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3000 \
              --connect-timeout 3 --max-time 5 2>/dev/null)
            if [ -n "$STATUS" ] && [ "$STATUS" != "000" ]; then
              echo "Frontend ready (HTTP $STATUS)"
              exit 0
            fi
            echo "  attempt $i/24 — not ready, retrying in 5s..."
            sleep 5
          done
          echo "Frontend did not respond after 2 minutes."
          tail -40 /tmp/frontend.log
          exit 1

      # ── Playwright ───────────────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
